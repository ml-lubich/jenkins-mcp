[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-mcp-cli"
version = "0.3.1"
description = "Jenkins CLI + MCP server — build lifecycle, pipelines, logs, artifacts, queue, credentials, plugins, multi-context, node/user admin, and a native MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Misha Lubich"}]
keywords = ["jenkins", "cli", "mcp", "devops", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # Upper bound is load-bearing: mcp 2.x renamed FastMCP to MCPServer and
    # moved mcp.server.fastmcp, so an unpinned install silently breaks the
    # server — it surfaces only as a collection error / "Connection closed".
    # Lift this together with a migration to MCPServer, not before.
    "mcp>=1.0.0,<2"
]

[project.urls]
Homepage = "https://github.com/ml-lubich/jenkins-mcp"
Repository = "https://github.com/ml-lubich/jenkins-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
jenkins-mcp = "jenkins_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
