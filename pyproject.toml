[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ijenk"
version = "0.1.0"
description = "Jenkins CLI + MCP server — manage nodes, users, and jobs from the terminal or from AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Misha Lubich"}]
keywords = ["jenkins", "cli", "mcp", "devops", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/ml-lubich/ijenk"
Repository = "https://github.com/ml-lubich/ijenk"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
ijenk = "ijenk.cli:main"
ijenk-mcp = "ijenk.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
